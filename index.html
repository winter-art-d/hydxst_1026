<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪漫星尘圣诞树</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; width: 100vw; height: 100vh; font-family: 'Microsoft YaHei', sans-serif; cursor: pointer; }
        
        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1; 
            filter: drop-shadow(0px 0px 8px rgba(255, 215, 0, 0.6));
        }

        #romantic-text {
            position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%);
            color: #fff8d6; font-size: 3.5rem; font-weight: bold; text-align: center;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffa500, 0 0 40px #ff8c00;
            pointer-events: none; 
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
            animation: textPulse 2s infinite alternate;
            z-index: 9999; 
            width: 100%;
        }
        
        @keyframes textPulse {
            0% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
            100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffa500, 0 0 60px #ff8c00; }
        }
        
        .hint { 
            position: absolute; bottom: 30px; width: 100%; text-align: center; 
            color: rgba(255,215,0,0.5); font-size: 16px; pointer-events: none; 
            letter-spacing: 3px; z-index: 9999; transition: opacity 1s;
        }
    </style>
</head>
<body>
    <div id="romantic-text">Merry Christmas<br><span style="font-size: 0.45em; color: #fff;">送给最喜欢的你</span></div>
    <div class="hint" id="bottom-hint">点击屏幕，看星尘聚散</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 230, 100, 1)'); 
            gradient.addColorStop(0.5, 'rgba(255, 180, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const treeParticleCount = 5000;
        const starParticleCount = 800; // 星星粒子多一点，形状更清晰
        const particleCount = treeParticleCount + starParticleCount;

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        const treeTargets = new Float32Array(particleCount * 3);
        const explodeTargets = new Float32Array(particleCount * 3);

        const colorGold = new THREE.Color(0xffd700); 
        const colorRed = new THREE.Color(0xff0000); 
        const colorGreen = new THREE.Color(0x00ff00); 
        const colorStar = new THREE.Color(0xffffaa); 

        for (let i = 0; i < particleCount; i++) {
            const index = i * 3;
            
            // 爆炸目标点（所有粒子共用）
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const rExp = 10 + Math.random() * 8; 
            explodeTargets[index] = rExp * Math.sin(phi) * Math.cos(theta);
            explodeTargets[index + 1] = rExp * Math.sin(phi) * Math.sin(theta);
            explodeTargets[index + 2] = rExp * Math.cos(phi);

            // --- 1. 圣诞树主体 ---
            if (i < treeParticleCount) {
                const y = (Math.random() - 0.5) * 12; 
                const maxRadius = 4.5;
                const radius = maxRadius * (0.5 - y / 12) * (0.8 + Math.random() * 0.2);
                const angle = y * 2 + Math.random() * Math.PI * 2;
                
                treeTargets[index] = Math.cos(angle) * radius;
                treeTargets[index + 1] = y;
                treeTargets[index + 2] = Math.sin(angle) * radius;

                let c = colorGold;
                const rand = Math.random();
                if (rand > 0.65 && rand < 0.85) c = colorRed;
                if (rand >= 0.85) c = colorGreen;
                
                colors[index] = c.r; colors[index + 1] = c.g; colors[index + 2] = c.b;

            } 
            // --- 2. 顶部的五角星 ---
            else {
                // 星星中心高度在 y=6.5 处
                const starCenterY = 6.5;
                
                // 🌟 用极坐标生成五角星
                // 5个外角，每隔 72 度一个
                const angleS = Math.random() * Math.PI * 2;
                // 计算当前位置对应的五角星边缘半径（核心逻辑）
                // 通过折叠角度，让外圈半径大，内圈半径小，形成尖角
                const k = (angleS * 5) / (Math.PI * 2); 
                const fraction = k - Math.floor(k);
                const starRadius = 0.5 + 1.2 * Math.abs(fraction - 0.5) * 2; // 控制五角星大小
                
                // 给星星一点Z轴厚度，且X和Y方向拉伸
                const rS = starRadius * Math.random(); 
                const xS = Math.cos(angleS) * rS;
                const yS = Math.sin(angleS) * rS;

                treeTargets[index] = xS;
                treeTargets[index + 1] = starCenterY + yS;
                treeTargets[index + 2] = (Math.random() - 0.5) * 0.5; // 星星的厚度

                colors[index] = colorStar.r; colors[index + 1] = colorStar.g; colors[index + 2] = colorStar.b;
            }

            positions[index] = treeTargets[index];
            positions[index + 1] = treeTargets[index + 1];
            positions[index + 2] = treeTargets[index + 2];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.3, // 稍微调小一点，星星尖角更明显
            map: createParticleTexture(),
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true 
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        let isExploded = false;
        let currentProgress = 0; 
        let time = 0;

        window.addEventListener('pointerdown', () => {
            isExploded = !isExploded;
            
            if (isExploded) {
                document.getElementById('romantic-text').style.opacity = '1';
                document.getElementById('bottom-hint').style.opacity = '0';
            } else {
                document.getElementById('romantic-text').style.opacity = '0';
                document.getElementById('bottom-hint').style.opacity = '1';
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const targetProgress = isExploded ? 1 : 0;
            currentProgress += (targetProgress - currentProgress) * 0.03;

            const positionsAttr = geometry.attributes.position;
            const posArray = positionsAttr.array;

            for (let i = 0; i < particleCount; i++) {
                const index = i * 3;
                
                const tx = treeTargets[index] * (1 - currentProgress) + explodeTargets[index] * currentProgress;
                const ty = treeTargets[index + 1] * (1 - currentProgress) + explodeTargets[index + 1] * currentProgress;
                const tz = treeTargets[index + 2] * (1 - currentProgress) + explodeTargets[index + 2] * currentProgress;

                const floatY = Math.sin(time * 2 + i) * 0.05;

                posArray[index] += (tx - posArray[index]) * 0.1;
                posArray[index + 1] += (ty + floatY - posArray[index + 1]) * 0.1;
                posArray[index + 2] += (tz - posArray[index + 2]) * 0.1;
            }
            positionsAttr.needsUpdate = true;

            particles.rotation.y = time * 0.2;
            if (isExploded) {
                particles.rotation.y += 0.01;
            }

            material.opacity = 0.85 + Math.sin(time * 3) * 0.15;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
